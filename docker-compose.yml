services:
  postgres:
    image: postgres:18-alpine
    container_name: crm_educativo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm_educativo
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_educativo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
